[[dotfiles]]
name = "opencode"
enabled = true
hidden = false
source = "dotfiles/opencode.jsonc"
target = "~/.config/opencode/opencode.jsonc"
commands = []
packages = []
depends = []
description = "personal opencode configuration"

[[dotfiles]]
name = "tmux"
enabled = true
hidden = false
source = "dotfiles/tmux.conf"
target = "~/.tmux.conf"
commands = ["tmux", "zsh", "bc", "xclip", "fzf"]
packages = ["tmux", "zsh", "bc", "xclip", "fzf"]
depends = ["tmux-session-launcher", "tmux-zshrc", "urxvt-resize-font", "tmux-xresources"]
description = "tmux configuration"

[[dotfiles]]
name = "tmux-session-launcher"
enabled = false
hidden = true
source = "scripts/tmux-session-launcher"
target = "~/.local/bin/tmux-session-launcher"
commands = ["bash", "tmux", "fzf"]
packages = ["bash", "tmux", "fzf"]
depends = []
description = "tmux popup session launcher"

[[dotfiles]]
name = "tmux-zshrc"
enabled = false
hidden = true
source = "dotfiles/tmux.zshrc"
target = "~/.cache/dotfiles/.zshrc"
commands = ["zsh"]
packages = ["zsh"]
depends = []
description = "tmux-specific zsh initialization"

[[dotfiles]]
name = "vim"
enabled = false
hidden = false
source = "dotfiles/vimrc"
target = "~/.vimrc"
commands = ["vim"]
packages = ["vim"]
depends = []
description = "vim configuration"

[[dotfiles]]
name = "shell"
enabled = false
hidden = false
source = "dotfiles/myrc"
target = "~/.myrc"
commands = ["sh"]
packages = []
depends = []
description = "shared shell configuration"

[[dotfiles]]
name = "urxvt-resize-font"
enabled = false
hidden = true
source = "dotfiles/urxvt/ext/resize-font"
target = "~/.urxvt/ext/resize-font"
commands = ["urxvt"]
packages = ["rxvt-unicode"]
depends = []
description = "URxvt resize-font extension"

[[dotfiles]]
name = "tmux-xresources"
enabled = false
hidden = true
source = "dotfiles/Xresources"
target = "~/.Xresources"
commands = ["xrdb", "urxvt"]
packages = ["x11-xserver-utils", "rxvt-unicode"]
depends = ["urxvt-resize-font"]
description = "X resources configuration"
