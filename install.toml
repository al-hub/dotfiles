[[dotfiles]]
name = "opencode"
enabled = true
hidden = false
source = "dotfiles/opencode.jsonc"
target = "~/.config/opencode/opencode.jsonc"
commands = []
packages = []
depends = []
description = "personal opencode configuration"

[[dotfiles]]
name = "tmux"
enabled = true
hidden = false
source = "dotfiles/tmux.conf"
target = "~/.tmux.conf"
commands = ["tmux", "zsh", "bc", "xclip"]
packages = ["tmux", "zsh", "bc", "xclip"]
depends = ["tmux-session-launcher", "tmux-zshrc", "urxvt-resize-font", "tmux-xresources", "tmux-theme-picker", "tmux-command-palette"]
description = "tmux configuration"

[[dotfiles]]
name = "tmux-session-launcher"
enabled = false
hidden = true
source = "scripts/tmux-session-launcher"
target = "~/.local/bin/tmux-session-launcher"
commands = ["bash", "tmux"]
packages = ["bash", "tmux"]
depends = ["tmux-sidebar-tmux-adapter", "tmux-sidebar-controller"]
description = "tmux session launcher with a single movable sidebar"

[[dotfiles]]
name = "tmux-sidebar-tmux-adapter"
enabled = false
