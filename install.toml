[[dotfiles]]
name = "tmux"
enabled = true
source = "dotfiles/tmux.conf"
target = "~/.tmux.conf"
commands = ["tmux", "zsh", "bc", "xclip"]
packages = ["tmux", "zsh", "bc", "xclip"]
description = "tmux configuration"

[[dotfiles]]
name = "vim"
enabled = false
source = "dotfiles/vimrc"
target = "~/.vimrc"
commands = ["vim"]
packages = ["vim"]
description = "vim configuration"

[[dotfiles]]
name = "shell"
enabled = false
source = "dotfiles/myrc"
target = "~/.myrc"
commands = ["sh"]
packages = []
description = "shared shell configuration"

[[dotfiles]]
name = "tmux-xresources"
enabled = false
source = "dotfiles/Xresources"
target = "~/.Xresources"
commands = ["xrdb"]
packages = ["x11-xserver-utils"]
description = "X resources configuration"
