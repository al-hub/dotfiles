target = "~/.local/bin/tmux-sidebar-controller"
commands = ["bash", "tmux"]
packages = ["bash", "tmux"]
depends = ["tmux-sidebar-tmux-adapter"]
description = "single sidebar lifecycle and session move controller"

[[dotfiles]]
name = "tmux-zshrc"
