# dotfiles module manifest
#
# type = "file"      copy `source` (repo path) to `target`; optional post_install hooks:
#                    "executable" (chmod +x), "xrdb-merge" (xrdb -merge when DISPLAY set)
# type = "upstream"  delegate to an independent repository's public setup.sh CLI
#                    (install | update | uninstall | purge | status). `repo` is cloned into
#                    `dir` unless $DOTFILES_DEV_ROOT/<name>/setup.sh exists. `min_version`
#                    is compared against `git describe --tags` and warns when below.
# hidden = true      not listed for the user; installed only as a dependency.

[[dotfiles]]
name = "opencode"
type = "file"
enabled = true
hidden = false
source = "dotfiles/opencode.jsonc"
target = "~/.config/opencode/opencode.jsonc"
commands = []
packages = []
depends = []
description = "personal opencode configuration"

[[dotfiles]]
name = "tmux-session-dock"
type = "upstream"
enabled = true
hidden = false
repo = "https://github.com/al-hub/tmux-session-dock.git"
dir = "~/.local/share/tmux-session-dock"
min_version = "v0.3.46"
commands = ["tmux", "bash", "git"]
packages = ["tmux", "git"]
depends = []
description = "upstream tmux session dock; owns ~/.tmux.conf and all tmux ergonomics"

[[dotfiles]]
name = "urxvt"
type = "file"
enabled = true
hidden = false
source = "dotfiles/Xresources"
target = "~/.Xresources"
post_install = ["xrdb-merge"]
commands = ["xrdb", "urxvt"]
packages = ["x11-xserver-utils", "rxvt-unicode"]
depends = ["urxvt-resize-font"]
description = "URxvt TrueColor, font and resize-font extension"

[[dotfiles]]
name = "urxvt-resize-font"
type = "file"
enabled = false
hidden = true
source = "dotfiles/urxvt/ext/resize-font"
target = "~/.urxvt/ext/resize-font"
post_install = ["executable"]
commands = ["urxvt"]
packages = ["rxvt-unicode"]
depends = []
description = "URxvt resize-font Perl extension"

[[dotfiles]]
name = "vim"
type = "file"
enabled = false
hidden = false
source = "dotfiles/vimrc"
target = "~/.vimrc"
commands = ["vim"]
packages = ["vim"]
depends = []
description = "vim configuration"

[[dotfiles]]
name = "shell"
type = "file"
enabled = false
hidden = false
source = "dotfiles/myrc"
target = "~/.myrc"
commands = ["sh"]
packages = []
depends = []
description = "shared shell configuration"
