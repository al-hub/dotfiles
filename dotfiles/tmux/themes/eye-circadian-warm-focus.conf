# Circadian-Warm Focus theme (Active/Inactive Contrast & Amber Night)
set -g status-style bg='#332211',fg='#ffb86c'
set -g status-left '#[bg=#f8a145]#[fg=#18120a]#{?client_prefix,#[bg=#d86030],}C-a'
set -ga status-left '#[bg=#332211]#[fg=#d86030]#{?window_zoomed_flag,#[bg=#d86030]#[fg=#332211],} z '
set -g window-status-current-style fg='#18120a',bg='#ffd3a3'
set -g window-style bg='#261b12'
set -g window-active-style bg='#120d08'
set -g pane-border-style fg='#382414',bg='#261b12'
set -g pane-active-border-style fg='#f8a145',bg='#120d08'
set -g status-right ""
set -g pane-border-format "#{?pane_active,#[fg=#ffd3a3]#[bold]#{pane_current_path}#[default],#[fg=#6d4926]#{pane_current_path}#[default]}"
