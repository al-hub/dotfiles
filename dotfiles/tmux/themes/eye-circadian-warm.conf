# Circadian-Warm theme (Blue-light Filtering / Melatonin Protection)
# Scientific Basis: Muted amber/orange wavelengths (long-wavelength light) minimize blue light to preserve circadian rhythms.
set -g status-style bg='#332211',fg='#ffb86c'
set -g status-left '#[bg=#f8a145]#[fg=#18120a]#{?client_prefix,#[bg=#d86030],}C-a'
set -ga status-left '#[bg=#332211]#[fg=#d86030]#{?window_zoomed_flag,#[bg=#d86030]#[fg=#332211],} z '
set -g window-status-current-style fg='#18120a',bg='#ffd3a3'
set -g window-style bg='#1e1810'
set -g window-active-style bg='#18120a'
set -g pane-border-style fg='#2d2010',bg='#18120a'
set -g pane-active-border-style fg='#5c3d18',bg='#1e1810'
set -g status-right ""
set -g pane-border-format "#{?pane_active,#[fg=#ffd3a3]#[bold]#{pane_current_path}#[default],#[fg=#5c3d18]#{pane_current_path}#[default]}"
