# Github-Light coding theme (High visibility daytime light theme)
set -g status-style bg='#eaeef2',fg='#0969da'
set -g status-left '#[bg=#2da44e]#[fg=#ffffff]#{?client_prefix,#[bg=#cf222e],}C-a'
set -ga status-left '#[bg='#eaeef2']#[fg=#0969da]#{?window_zoomed_flag,#[bg=#cf222e]#[fg=#ffffff],} z '
set -g window-status-current-style fg='#ffffff',bg='#0969da'
set -g window-style bg='#ffffff'
set -g window-active-style bg='#f6f8fa'
set -g pane-border-style fg='#d0d7de',bg='#f6f8fa'
set -g pane-active-border-style fg='#0969da',bg='#ffffff'
set -g status-right ""
set -g pane-border-format "#{?pane_active,#[fg=#0969da]#[bold]#{pane_current_path}#[default],#[fg=#57606a]#{pane_current_path}#[default]}"
