# Scotopic-Forest Focus theme (Active/Inactive Contrast & Herb Green)
set -g status-style bg='#22332a',fg='#a3be8c'
set -g status-left '#[bg=#8fbcbb]#[fg=#0e1411]#{?client_prefix,#[bg=#bf616a],}C-a'
set -ga status-left '#[bg='#22332a']#[fg=#bf616a]#{?window_zoomed_flag,#[bg=#bf616a]#[fg=#22332a],} z '
set -g window-status-current-style fg='#0e1411',bg='#a3be8c'
set -g window-style bg='#18221d'
set -g window-active-style bg='#0a0f0d'
set -g pane-border-style fg='#1c2b22',bg='#18221d'
set -g pane-active-border-style fg='#a3be8c',bg='#0a0f0d'
set -g status-right ""
set -g pane-border-format "#{?pane_active,#[fg=#d8eed0]#[bold]#{pane_current_path}#[default],#[fg=#3e594b]#{pane_current_path}#[default]}"
