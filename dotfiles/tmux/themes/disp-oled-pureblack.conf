# OLED Pure Black Theme (Zero Pixel Power & Infinite Contrast)
set -g status-style bg='#000000',fg='#00f0ff'
set -g status-left '#[bg=#00f0ff]#[fg=#000000]#{?client_prefix,#[bg=#00e676],}C-a'
set -ga status-left '#[bg=#000000]#[fg=#00e676]#{?window_zoomed_flag,#[bg=#00e676]#[fg=#000000],} z '
set -g window-status-current-style fg='#000000',bg='#00f0ff'
set -g window-style bg='#0d0d0d'
set -g window-active-style bg='#000000'
set -g pane-border-style fg='#222222',bg='#0d0d0d'
set -g pane-active-border-style fg='#00f0ff',bg='#000000'
set -g status-right ""
set -g pane-border-format "#{?pane_active,#[fg=#00f0ff]#[bold]#{pane_current_path}#[default],#[fg=#555555]#{pane_current_path}#[default]}"
