# Gruvbox Focus theme (Active/Inactive Pane Contrast)
set -g status-style bg='#3c3836',fg='#ebdbb2'
set -g status-left '#[bg=#fabd2f]#[fg=#282828]#{?client_prefix,#[bg=#fb4934],}C-a'
set -ga status-left '#[bg='#3c3836']#[fg=#fb4934]#{?window_zoomed_flag,#[bg=#fb4934]#[fg=#3c3836],} z '
set -g window-status-current-style fg='#282828',bg='#b8bb26'
set -g window-style bg='#282828'
set -g window-active-style bg='#1d2021'
set -g pane-border-style fg='#3c3836',bg='#282828'
set -g pane-active-border-style fg='#fabd2f',bg='#1d2021'
set -g status-right ""
set -g pane-border-format "#{?pane_active,#[fg=#ebdbb2]#[bold]#{pane_current_path}#[default],#[fg=#665c54]#{pane_current_path}#[default]}"
