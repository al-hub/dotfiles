# Solarized Dark theme
set -g status-style bg='#073642',fg='#268bd2'
set -g status-left '#[bg=#2aa198]#[fg=#002b36]#{?client_prefix,#[bg=#dc322f],}C-a'
set -ga status-left '#[bg=#073642]#[fg=#dc322f]#{?window_zoomed_flag,#[bg=#dc322f]#[fg=#073642],} z '
set -g window-status-current-style fg='#002b36',bg='#859900'
set -g window-style bg='#002b36'
set -g window-active-style bg='#073642'
set -g pane-border-style fg='#586e75',bg='#073642'
set -g pane-active-border-style fg='#93a1a1',bg='#002b36'
set -g status-right ""
set -g pane-border-format "#{?pane_active,#[fg=#eee8d5]#[bold]#{pane_current_path}#[default],#[fg=#586e75]#{pane_current_path}#[default]}"
