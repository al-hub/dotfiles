# Apple Terminal Pro Theme (macOS Graphite & System Neon)
set -g status-style bg='#000000',fg='#30d158'
set -g status-left '#[bg=#30d158]#[fg=#000000]#{?client_prefix,#[bg=#0a84ff],}C-a'
set -ga status-left '#[bg=#000000]#[fg=#0a84ff]#{?window_zoomed_flag,#[bg=#0a84ff]#[fg=#000000],} z '
set -g window-status-current-style fg='#000000',bg='#30d158'
set -g window-style bg='#1c1c1e'
set -g window-active-style bg='#000000'
set -g pane-border-style fg='#3a3a3c',bg='#1c1c1e'
set -g pane-active-border-style fg='#30d158',bg='#000000'
set -g status-right ""
set -g pane-border-format "#{?pane_active,#[fg=#f2f2f7]#[bold]#{pane_current_path}#[default],#[fg=#636366]#{pane_current_path}#[default]}"
