# Solarized Dark Focus theme (Active/Inactive Pane Contrast)
set -g status-style bg='#073642',fg='#268bd2'
set -g status-left '#[bg=#2aa198]#[fg=#002b36]#{?client_prefix,#[bg=#dc322f],}C-a'
set -ga status-left '#[bg=#073642]#[fg=#dc322f]#{?window_zoomed_flag,#[bg=#dc322f]#[fg=#073642],} z '
set -g window-status-current-style fg='#002b36',bg='#859900'
set -g window-style bg='#002b36'
set -g window-active-style bg='#001e26'
set -g pane-border-style fg='#073642',bg='#002b36'
set -g pane-active-border-style fg='#268bd2',bg='#001e26'
set -g status-right ""
set -g pane-border-format "#{?pane_active,#[fg=#fdf6e3]#[bold]#{pane_current_path}#[default],#[fg=#586e75]#{pane_current_path}#[default]}"
