# ==============================================================================
# dotfiles ~/.tmux.conf
# Personal Workspace Orchestrator & tmux-session-dock Integration
# ==============================================================================

# 1. Shell Environment Integration (tmux.zshrc Bridge)
# ------------------------------------------------------------------------------
set-option -g default-shell /bin/zsh
set-option -g default-command 'exec env ZDOTDIR="$HOME/.cache/dotfiles" /bin/zsh'

# 2. Upstream tmux-session-dock Integration (Full Ergonomics Preset Enabled)
# ------------------------------------------------------------------------------
set -g @session-dock-dotfiles-mode "on"
run-shell 'bash "$HOME/workspace/tmux-session-dock/session-dock.tmux" 2>/dev/null || bash ~/.local/share/tmux-session-dock/session-dock.tmux 2>/dev/null || true'

# 3. Workspace Navigation & Window Tabs
# ------------------------------------------------------------------------------
bind-key -N "➡️ 다음 윈도우로 이동" Tab next-window
bind-key -N "⬅️ 이전 윈도우로 이동" BTab previous-window

# Pane Swap/Reorder (Ctrl+Alt+Arrow)
bind-key -n 'C-M-Left'  select-pane -L \; swap-pane -s '!' \; select-pane -L
bind-key -n 'C-M-Up'    select-pane -U \; swap-pane -s '!' \; select-pane -U
bind-key -n 'C-M-Right' select-pane -R \; swap-pane -s '!' \; select-pane -R
bind-key -n 'C-M-Down'  select-pane -D \; swap-pane -s '!' \; select-pane -D

# Break pane into new window
bind-key n split-window -v \; select-pane -U \; break-pane

# 4. Copy Mode & Clipboard (Vi Keybindings + xclip)
# ------------------------------------------------------------------------------
set-window-option -g mode-keys vi
bind-key Escape copy-mode
bind-key p paste-buffer
bind-key v capture-pane \; save-buffer ~/.config/tmux-buffer \; new-window -n "vim-copymode" '$SHELL -c "vim ~/.config/tmux-buffer"'
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'V' send -X select-line
bind-key -T copy-mode-vi 'r' send -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

# 5. Theme & Styling
# ------------------------------------------------------------------------------
set -g status-position bottom
if-shell 'test -f ~/.config/tmux/theme.conf' \
    'source-file ~/.config/tmux/theme.conf'

# 6. Vim-tmux-navigator Integration
# ------------------------------------------------------------------------------
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"
