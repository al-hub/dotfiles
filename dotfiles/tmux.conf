#basic setting
#-------------------------------------------------------------
unbind-key c-b
set-option -g prefix c-a
set -g mouse on
set -g default-terminal "xterm-256color"

set-option -g history-limit 4096
set-window-option -g mode-keys vi

unbind-key 'S-Up'
unbind-key 'S-Down'

bind-key -n 'S-Up' display-message 'S-Up' 
bind-key -n 'S-Down' display-message 'S-Down' 
#set -g utf8 on 

set-option -g default-shell /bin/zsh
set-option -g default-command 'exec env ZDOTDIR="$HOME/.cache/dotfiles" /bin/zsh'
#-------------------------------------------------------------


#pane/windows control 
#-------------------------------------------------------------
bind c new-window -c "#{pane_current_path}"
unbind-key %
unbind-key '"'
bind-key -N "✂️ 작업 영역 가로 분할" | run-shell "$HOME/.local/bin/tmux-session-launcher --split-horizontal"
bind-key -N "✂️ 작업 영역 세로 분할" _ run-shell "$HOME/.local/bin/tmux-session-launcher --split-vertical"
bind-key -N "✂️ 작업 영역 가로 분할 (기본)" % run-shell "$HOME/.local/bin/tmux-session-launcher --split-horizontal"
bind-key -N "✂️ 작업 영역 세로 분할 (기본)" '"' run-shell "$HOME/.local/bin/tmux-session-launcher --split-vertical"
#bind '"' split-window -c "#{pane_current_path}"
#bind % split-window -h -c "#{pane_current_path}"
#resize #bind-key J resize-pane -D 5 #bind-key K resize-pane -U 5 #bind-key H resize-pane -L 5 #bind-key L resize-pane -R 5
#-------------------------------------------------------------


#pane navigation (Alt+Arrow: match PowerShell)
#-------------------------------------------------------------
bind-key -n 'M-Left'  select-pane -L
bind-key -n 'M-Down'  select-pane -D
bind-key -n 'M-Up'    select-pane -U
bind-key -n 'M-Right' select-pane -R
bind-key -n 'C-\' select-pane -l
bind-key -T root MouseDown1Pane run-shell -b "$HOME/.local/bin/tmux-session-launcher --mouse-select '#{mouse_pane}' '#{mouse_line}' '#{mouse_x}' '#{mouse_word}'" \; select-pane -t = \; send-keys -M

unbind-key s
bind-key -N "🗂️ 세션 런처 사이드바 토글" s run-shell "$HOME/.local/bin/tmux-session-launcher --open-sidebar"

bind-key -N "➡️ 다음 윈도우로 이동" Tab next-window
bind-key -N "⬅️ 이전 윈도우로 이동" BTab previous-window

#pane swap/reorder (Ctrl+Alt+Arrow)
#https://itectec.com/superuser/tmux-keybinding-to-swap-pane-left-or-right/
bind-key -n 'C-M-Left'  select-pane -L \; swap-pane -s '!' \; select-pane -L
bind-key -n 'C-M-Up'    select-pane -U \; swap-pane -s '!' \; select-pane -U
bind-key -n 'C-M-Right' select-pane -R \; swap-pane -s '!' \; select-pane -R
bind-key -n 'C-M-Down'  select-pane -D \; swap-pane -s '!' \; select-pane -D



#new window n was next-window
bind-key n split-window -v \; select-pane -U \; break-pane
#-------------------------------------------------------------


#copy mode #https://github.com/gotbletu/dotfiles_v2/blob/master/normal_user/tmux/.tmux.conf
#-------------------------------------------------------------
bind-key Escape copy-mode	# default key: prefix [
bind-key p paste-buffer		# default key: prefix ] ; interactively clipboard history key: prefix = 
bind-key v capture-pane \; save-buffer ~/.config/tmux-buffer \; new-window -n "vim-copymode" '$SHELL -c "vim ~/.config/tmux-buffer"'
#bind-key < run-shell "tmux set-buffer -- \"$(xsel -o -b)\"" \; display-message "copy to tmux clipboard"
#bind-key > run-shell 'tmux show-buffer | xsel -i -b' \; display-message "copy to system clipboard"

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'V' send -X select-line
bind-key -T copy-mode-vi 'r' send -X rectangle-toggle
#bind -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "reattach-to-user-namespace pbcopy | xclip -in -selection clipboard"
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
#-------------------------------------------------------------


#style status bar 
#-------------------------------------------------------------
set -g status-position bottom
set -g status-interval 1
set -g pane-border-status top

# Load active theme if exists (fallback to baseline.conf handled in install phase)
if-shell 'test -f ~/.config/tmux/theme.conf' \
    'source-file ~/.config/tmux/theme.conf'

# Keybinding for theme picker (Ctrl+a T) - 팝업 크기를 60% x 55%로 확대 및 -N 설명 추가
bind-key -N "🎨 테마 피커 실행" T display-popup -E -w 60% -h 55% "$HOME/.local/bin/tmux-theme-picker"

# Keybinding for command palette (Ctrl+a /)
bind-key -N "⌨️ 단축키 커맨드 팔레트 실행" / display-popup -E -w 70% -h 60% "env TMUX_PANE='#{pane_id}' $HOME/.local/bin/tmux-command-palette"


