# ==============================================================================
# dotfiles ~/.tmux.conf
# Personal Workspace Configuration & Upstream tmux-session-dock Integration
# ==============================================================================

# Basic settings
# ------------------------------------------------------------------------------
unbind-key C-b
set-option -g prefix C-a
bind-key C-a send-prefix
set -g mouse on
set -g default-terminal "xterm-256color"

set-option -g history-limit 4096
set-window-option -g mode-keys vi

unbind-key 'S-Up'
unbind-key 'S-Down'
bind-key -n 'S-Up' display-message 'S-Up' 
bind-key -n 'S-Down' display-message 'S-Down' 

set-option -g default-shell /bin/zsh
set-option -g default-command 'exec env ZDOTDIR="$HOME/.cache/dotfiles" /bin/zsh'

# Window / Pane Control
# ------------------------------------------------------------------------------
bind c new-window -c "#{pane_current_path}"
unbind-key %
unbind-key '"'

# Upstream tmux-session-dock Plugin Integration
# ------------------------------------------------------------------------------
run-shell 'bash ~/.local/share/tmux-session-dock/session-dock.tmux 2>/dev/null || bash "$HOME/workspace/tmux-session-dock/session-dock.tmux" 2>/dev/null || true'

# Direct Fallback Keybindings (when session-dock is running in PATH)
bind-key -N "🗂️ 세션 도크 사이드바 토글" s run-shell "$HOME/.local/bin/tmux-session-dock --toggle-sidebar" 2>/dev/null || run-shell "tmux-session-dock --toggle-sidebar"
bind-key -N "🔄 서브페인 상/하 위치 전환" P run-shell "$HOME/.local/bin/tmux-session-dock --swap-subpane-position" 2>/dev/null || run-shell "tmux-session-dock --swap-subpane-position"
bind-key -N "✂️ 작업 영역 가로 분할" | run-shell "$HOME/.local/bin/tmux-session-dock --split-horizontal" 2>/dev/null || run-shell "tmux-session-dock --split-horizontal"
bind-key -N "✂️ 작업 영역 세로 분할" _ run-shell "$HOME/.local/bin/tmux-session-dock --split-vertical" 2>/dev/null || run-shell "tmux-session-dock --split-vertical"
bind-key -N "✂️ 작업 영역 가로 분할 (기본)" % run-shell "$HOME/.local/bin/tmux-session-dock --split-horizontal" 2>/dev/null || run-shell "tmux-session-dock --split-horizontal"
bind-key -N "✂️ 작업 영역 세로 분할 (기본)" '"' run-shell "$HOME/.local/bin/tmux-session-dock --split-vertical" 2>/dev/null || run-shell "tmux-session-dock --split-vertical"

# Pane Navigation & Selection
# ------------------------------------------------------------------------------
bind-key -n 'M-Left'  select-pane -L
bind-key -n 'M-Down'  select-pane -D
bind-key -n 'M-Up'    select-pane -U
bind-key -n 'M-Right' select-pane -R
bind-key -n 'C-\' select-pane -l
bind-key -T root MouseDown1Pane run-shell -b "$HOME/.local/bin/tmux-session-dock --mouse-select '#{mouse_pane}' '#{mouse_y}' '#{mouse_x}' '#{mouse_word}'" 2>/dev/null \; select-pane -t = \; send-keys -M

bind-key -N "➡️ 다음 윈도우로 이동" Tab next-window
bind-key -N "⬅️ 이전 윈도우로 이동" BTab previous-window

# Pane Swap/Reorder (Ctrl+Alt+Arrow)
bind-key -n 'C-M-Left'  select-pane -L \; swap-pane -s '!' \; select-pane -L
bind-key -n 'C-M-Up'    select-pane -U \; swap-pane -s '!' \; select-pane -U
bind-key -n 'C-M-Right' select-pane -R \; swap-pane -s '!' \; select-pane -R
bind-key -n 'C-M-Down'  select-pane -D \; swap-pane -s '!' \; select-pane -D

# Break pane into new window
bind-key n split-window -v \; select-pane -U \; break-pane

# Copy Mode (Vi Keybindings)
# ------------------------------------------------------------------------------
bind-key Escape copy-mode
bind-key p paste-buffer
bind-key v capture-pane \; save-buffer ~/.config/tmux-buffer \; new-window -n "vim-copymode" '$SHELL -c "vim ~/.config/tmux-buffer"'
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'V' send -X select-line
bind-key -T copy-mode-vi 'r' send -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

# Style & Status Bar
# ------------------------------------------------------------------------------
set -g status-position bottom
set -g status-interval 1
set -g pane-border-status top

# Load active theme if exists
if-shell 'test -f ~/.config/tmux/theme.conf' \
    'source-file ~/.config/tmux/theme.conf'

# Keybinding for theme picker (Ctrl+a T)
bind-key -N "🎨 38종 테마 피커 실행" T display-popup -E -w 75% -h 65% "$HOME/.local/bin/tmux-theme-picker"

# Keybinding for command palette (Ctrl+a /)
bind-key -N "⌨️ 단축키 커맨드 팔레트 실행" / display-popup -E -w 70% -h 60% "env TMUX_PANE='#{pane_id}' $HOME/.local/bin/tmux-command-palette"

# Keybinding for help viewer (Ctrl+a h & Ctrl+a ?)
bind-key -N "📖 단축키 및 기능 도움말 실행" h display-popup -E -w 70% -h 65% "$HOME/.local/bin/tmux-help-viewer"
bind-key -N "📖 단축키 및 기능 도움말 실행" ? display-popup -E -w 70% -h 65% "$HOME/.local/bin/tmux-help-viewer"

# Mouse toggle
bind-key m set-option -g -q mouse on \; display-message 'Mouse: ON'
bind-key M set-option -g -q mouse off \; display-message 'Mouse: OFF'

# Vim-tmux-navigator integration
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"
